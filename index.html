<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Say it</title>
  <meta name="description" content="A simple line generator: pick a lean, a vibe and a moment, and get a word to start with, then a line you can actually say. Or ask about the teachers behind it.">
  <meta name="theme-color" content="#F7F6F2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Say it">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Say it">
  <link rel="canonical" href="https://mhccog.github.io/read-anyone/">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Say it">
  <meta property="og:title" content="Say it">
  <meta property="og:description" content="A simple line generator: pick a lean, a vibe and a moment, and get a word to start with, then a line you can actually say.">
  <meta property="og:url" content="https://mhccog.github.io/read-anyone/">
  <meta property="og:image" content="https://mhccog.github.io/read-anyone/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Say it">
  <meta name="twitter:description" content="A simple line generator: pick a lean, a vibe and a moment, and get a word to start with, then a line you can actually say.">
  <meta name="twitter:image" content="https://mhccog.github.io/read-anyone/og.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <noscript>
    <div class="app">
      <h1>Say it</h1>
      <p>This generator needs JavaScript. Please turn it on, then reload.</p>
    </div>
  </noscript>
  <div class="mode-wrap">
    <div class="seg" role="tablist" aria-label="Mode">
      <button type="button" role="tab" data-mode="gen" class="is-on" aria-selected="true">Generate</button>
      <button type="button" role="tab" data-mode="ask" aria-selected="false">Ask</button>
    </div>
  </div>
  <div id="app"></div>
  <section id="ask" class="ask" hidden aria-label="Ask about the teachers">
    <div class="ask-wrap">
      <div class="top">
        <div><div class="kicker">Read Anyone</div><h1>Ask</h1></div>
        <button type="button" class="saved-btn" id="askGloss">Glossary</button>
      </div>
      <p class="lede">Ask about Van Edwards, Hughes or Giang. Answers come only from their own books, talks and videos.</p>
      <div class="picks ask-filter" id="askFilter" aria-label="Teacher"></div>
      <div id="askLog" class="ask-log" aria-live="polite"></div>
      <p class="ask-clear-row"><button type="button" class="link-btn" id="askClear" hidden>Clear chat</button></p>
    </div>
    <form id="askBar" class="ask-bar" autocomplete="off">
      <div class="ask-bar-in">
        <input id="askInput" type="text" inputmode="text" enterkeyhint="send" placeholder="Ask anything about their work" aria-label="Your question">
        <button type="button" id="askMic" class="mic" aria-label="Speak your question"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg></button>
        <button type="submit" class="send" aria-label="Ask"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 4 5 11l1.4 1.4L11 7.8V20h2V7.8l4.6 4.6L19 11z"/></svg></button>
      </div>
    </form>
    <dialog id="askDlg" class="ask-dlg">
      <div class="dlg-in">
        <p class="dlg-close-row"><button type="button" class="btn" id="askDlgClose">Done</button></p>
        <div id="askDlgBody"></div>
      </div>
    </dialog>
  </section>
  <script src="app.js" defer></script>
  <script src="ask/ui.js" defer></script>
</body>
</html>
